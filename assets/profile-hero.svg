    <text x="96" y="78" fill="#1c1b18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" letter-spacing="3">TANG ZELONG / AI BUILDER</text>
    <text x="74" y="172" fill="#151411" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">ZEL MAKES</text>
    <text x="72" y="244" fill="#151411" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">THINGS.</text>
    <text x="76" y="294" fill="#5d5952" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="25">把模糊想法做成可运行、可验证、可交接的 AI 工具</text>
    <path d="M76 332H592" stroke="#1c1b18" stroke-width="2"/>
    <text x="76" y="361" fill="#1c1b18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" letter-spacing="2">IDEA  →  VERIFY  →  SHIP</text>
  </g>

